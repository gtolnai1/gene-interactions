<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#173d38">
<title>Gene Interactions – Self-Check Quiz</title>
<style>
:root{color-scheme:light;--ink:#18352f;--muted:#526b65;--paper:#f5f3e9;--card:#fffef9;--green:#176b57;--lime:#d7ec9c;--line:#d9e2d3;--wrong:#a53c35;--good:#176b57;--shadow:0 18px 48px #143c3220}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 10% 3%,#dce9bd 0,transparent 38%),radial-gradient(ellipse at 90% 95%,#c9e1d4 0,transparent 37%),var(--paper);font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink);line-height:1.55}
main{width:min(900px,100% - 32px);margin:0 auto;padding:34px 0 60px}.hero{padding:12px 4px 24px}.eyebrow{text-transform:uppercase;letter-spacing:.13em;font-weight:800;color:var(--green);font-size:.76rem}.hero h1{font-size:clamp(2rem,5vw,3.6rem);line-height:1.06;letter-spacing:-.04em;margin:10px 0 12px;max-width:760px}.hero p{color:var(--muted);max-width:670px;margin:0;font-size:1.05rem}.panel{background:var(--card);border:1px solid #dce5d9;border-radius:24px;padding:clamp(18px,4vw,34px);box-shadow:var(--shadow)}.topline{display:flex;gap:12px;align-items:center;justify-content:space-between;margin-bottom:20px}.progress-label{font-weight:750;font-size:.94rem}.score-pill{background:#e9f2d8;padding:7px 12px;border-radius:999px;font-size:.88rem;font-weight:800;white-space:nowrap}.track{height:8px;background:#e5eadf;border-radius:9px;overflow:hidden;margin:0 0 25px}.track span{display:block;height:100%;width:0;background:linear-gradient(90deg,#176b57,#9ab744);transition:width .3s ease}.question{font-size:clamp(1.2rem,2.7vw,1.65rem);font-weight:760;line-height:1.33;margin:0 0 20px}.answers{display:grid;gap:11px}.answer{display:flex;gap:13px;align-items:flex-start;width:100%;text-align:left;padding:14px 16px;border:1.5px solid var(--line);border-radius:15px;background:#fff;color:var(--ink);font:inherit;cursor:pointer;transition:transform .13s,border-color .13s,background .13s}.answer:hover{border-color:#84a69a;transform:translateY(-1px)}.answer:focus-visible,.navbtn:focus-visible,.action:focus-visible{outline:3px solid #d2a631;outline-offset:3px}.answer[aria-pressed="true"]{border-color:var(--green);background:#eff6e7;box-shadow:inset 0 0 0 1px var(--green)}.letter{flex:0 0 28px;height:28px;border-radius:50%;display:grid;place-items:center;background:#edf0e7;font-size:.83rem;font-weight:850;color:var(--green);margin-top:1px}.answer[aria-pressed="true"] .letter{background:var(--green);color:white}.answer-text{padding-top:2px}.feedback{display:none;margin-top:12px;padding:12px 14px;border-radius:13px;font-weight:650}.feedback.show{display:block}.feedback.correct{background:#e4f3e7;color:#145640}.feedback.incorrect{background:#fbe9e5;color:#812b28}.explanation{font-weight:450;margin-top:4px}.controls{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-top:24px}.navgroup{display:flex;gap:10px}.navbtn,.action{border:0;border-radius:12px;padding:12px 16px;font:inherit;font-weight:800;cursor:pointer}.navbtn{background:#e9eee5;color:var(--ink)}.navbtn:disabled{opacity:.42;cursor:not-allowed}.action{background:var(--green);color:white}.action:hover{background:#105343}.action.secondary{background:#e9eee5;color:var(--ink)}.results{display:none;margin-top:22px}.results.show{display:block}.resultbox{border-radius:18px;padding:18px 20px;background:#edf4df;border:1px solid #d3e2bd}.resultbox h2{margin:0 0 4px;font-size:1.3rem}.resultbox p{margin:0;color:var(--muted)}.resultline{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:12px}.review{margin-top:18px;display:grid;gap:10px}.review-item{border:1px solid var(--line);border-radius:14px;padding:13px 15px;background:#fff}.review-item.good{border-left:5px solid var(--good)}.review-item.bad{border-left:5px solid var(--wrong)}.review-item strong{display:block;margin-bottom:4px}.review-item p{margin:3px 0;color:var(--muted)}.footnote{text-align:center;color:var(--muted);font-size:.85rem;margin-top:18px}
@media(max-width:560px){main{width:min(100% - 20px,900px);padding-top:22px}.panel{border-radius:18px}.controls{align-items:stretch;flex-direction:column-reverse}.navgroup{display:grid;grid-template-columns:1fr 1fr}.navbtn,.action{min-height:46px}.resultline{align-items:flex-start;flex-direction:column}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;transition:none!important}}
</style>
</head>
<body>
<main>
<header class="hero">
  <div class="eyebrow">Biology · inheritance</div>
  <h1>Gene interactions</h1>
  <p>A self-check multiple-choice quiz on key concepts and inheritance patterns. Choose the best answer for each question, then check your knowledge!</p>
</header>
<section class="panel" aria-label="Interactive quiz">
  <div class="topline"><span class="progress-label" id="progressLabel">Question 1 / 18</span><span class="score-pill" id="answeredLabel">Answered: 0 / 18</span></div>
  <div class="track" aria-hidden="true"><span id="progressBar"></span></div>
  <div id="quizArea" aria-live="polite"></div>
  <div class="controls" id="controls">
    <div class="navgroup"><button class="navbtn" id="prevBtn" type="button">← Previous</button><button class="navbtn" id="nextBtn" type="button">Next →</button></div>
    <button class="action" id="checkBtn" type="button">Check answers</button>
  </div>
  <section class="results" id="results" aria-live="polite"></section>
</section>
<p class="footnote">18 questions · 1 point each</p>
</main>
<script>
const questions = [
 {q:"What does it mean when more than one gene contributes to the development of a trait?",a:["The interaction of genes influences the phenotype.","The trait is determined only by the environment.","Genes function only in gametes.","All offspring will have the same phenotype."],c:0,e:"Alleles of different genes can interact, and the result of this interaction appears in the phenotype."},
 {q:"In the example, how many gene pairs determine comb shape in domestic chickens?",a:["One gene pair.","Two gene pairs.","Three gene pairs.","The number of genes cannot be determined."],c:1,e:"Comb shape is influenced by two genes, each with two alleles: R/r and B/b."},
 {q:"What comb phenotype do RrBb offspring have in the chicken comb example?",a:["Walnut comb.","Pea comb.","Rose comb.","Serrated comb."],c:0,e:"They carry at least one dominant allele of each gene, so they have walnut combs."},
 {q:"What is the characteristic F₂ phenotypic ratio in the two-gene chicken comb example?",a:["9 : 3 : 3 : 1.","3 : 1.","9 : 7.","12 : 3 : 1."],c:0,e:"The four phenotypes occur in the ratio 9 walnut : 3 rose : 3 pea : 1 serrated."},
 {q:"What is meant by a pleiotropic effect?",a:["One gene affects several different traits.","Several genes determine a single trait.","A dominant allele masks the effect of another gene.","The effects of two genes are added together."],c:0,e:"In pleiotropy, a single gene contributes to the development of several phenotypic traits."},
 {q:"Which example illustrates one gene having effects on more than one phenotype?",a:["One pea gene affects both flower colour and seed coat colour.","Two gene pairs determine chicken comb shape.","The dominant A allele masks the effect of gene B.","Two dominant alleles together produce purple maize kernels."],c:0,e:"In the pea example, the same gene affects flower and seed coat colour through anthocyanin production."},
 {q:"What is an epistatic gene interaction?",a:["One gene suppresses the effect of another gene.","One gene produces several different traits.","Two genes always produce the same phenotype.","Alleles change in response to the environment."],c:0,e:"An epistatic gene suppresses the phenotypic effect of another gene."},
 {q:"In dominant epistasis, what produces the suppressing effect?",a:["The dominant allele of the epistatic gene.","The homozygous recessive genotype of the epistatic gene.","The recessive alleles of both genes in every case.","The two dominant alleles of the other gene."],c:0,e:"In dominant epistasis, one dominant allele of a gene is enough to produce the masking effect."},
 {q:"Which phenotypic ratio is characteristic of the dominant epistasis example?",a:["12 : 3 : 1.","9 : 3 : 4.","9 : 6 : 1.","13 : 3."],c:0,e:"The dihybrid cross in the dominant epistasis example gives a 12 : 3 : 1 ratio."},
 {q:"In the example, which genotype produces the suppressing effect in recessive epistasis?",a:["The homozygous recessive aa genotype of gene A.","At least one dominant allele of gene A.","The homozygous BB genotype of gene B.","The heterozygous genotype of both genes."],c:0,e:"In the example of recessive epistasis, the aa genotype suppresses the effect of gene B."},
 {q:"Which phenotypic ratio is characteristic of recessive epistasis in the example?",a:["9 : 3 : 4.","12 : 3 : 1.","15 : 1.","9 : 7."],c:0,e:"Combining the phenotypes of the aa genotypes gives the 9 : 3 : 4 ratio."},
 {q:"What characterises the additive effect of two genes?",a:["The effects of both genes add together in producing the phenotype.","One gene completely suppresses the other.","One gene determines several traits.","Only recessive alleles influence the phenotype."],c:0,e:"With an additive effect, the dominant alleles of both genes contribute to the phenotype."},
 {q:"Which phenotypic ratio is characteristic of the additive gene interaction in the example?",a:["9 : 6 : 1.","9 : 3 : 3 : 1.","9 : 7.","13 : 3."],c:0,e:"The additive gene interaction described produces a 9 : 6 : 1 phenotypic ratio."},
 {q:"Which phenotypic ratio is associated with the double dominant effect in the example?",a:["15 : 1.","9 : 7.","12 : 3 : 1.","9 : 6 : 1."],c:0,e:"In the shepherd's purse example, only the aabb genotype produces a different phenotype, giving a 15 : 1 ratio."},
 {q:"What is the key feature of complementary gene action in the maize example?",a:["Dominant alleles of both genes must be present together for the purple colour.","A dominant allele of either gene alone produces the purple colour.","A homozygous recessive pair of one gene suppresses the other gene.","One gene produces several different pigments."],c:0,e:"The purple colour requires at least one dominant allele of each gene; this gives a 9 : 7 ratio."},
 {q:"Which phenotypic ratio is associated with complementary gene action?",a:["9 : 7.","15 : 1.","9 : 6 : 1.","13 : 3."],c:0,e:"The complementary action of the dominant alleles of both genes produces a 9 : 7 ratio."},
 {q:"In the example of dominant-recessive gene interaction affecting chicken feather colour, what does allele A do?",a:["It suppresses the feather-colour-producing effect of allele B.","Together with allele B, it always produces coloured feathers.","It produces coloured feathers only in the aa genotype.","It changes comb shape regardless of feather colour."],c:0,e:"In the example, allele A suppresses the effect of allele B that would produce coloured feathers."},
 {q:"Which phenotypic ratio is characteristic of the dominant-recessive gene interaction in the example?",a:["13 : 3.","9 : 3 : 4.","12 : 3 : 1.","9 : 7."],c:0,e:"The example of chicken feather colour gives a 13 : 3 ratio."}
];
let current=0, answers=Array(questions.length).fill(null), checked=false;
const area=document.getElementById('quizArea'), progressLabel=document.getElementById('progressLabel'), answeredLabel=document.getElementById('answeredLabel'), progressBar=document.getElementById('progressBar'), prevBtn=document.getElementById('prevBtn'), nextBtn=document.getElementById('nextBtn'), results=document.getElementById('results');
function render(){const item=questions[current];progressLabel.textContent=`Question ${current+1} / ${questions.length}`;answeredLabel.textContent=`Answered: ${answers.filter(x=>x!==null).length} / ${questions.length}`;progressBar.style.width=`${(answers.filter(x=>x!==null).length/questions.length)*100}%`;prevBtn.disabled=current===0;nextBtn.disabled=current===questions.length-1;
 let html=`<h2 class="question" id="questionText">${current+1}. ${item.q}</h2><div class="answers" role="group" aria-labelledby="questionText">`;
 item.a.forEach((text,i)=>{html+=`<button class="answer" type="button" aria-pressed="${answers[current]===i}" data-choice="${i}"><span class="letter">${String.fromCharCode(65+i)}</span><span class="answer-text">${text}</span></button>`});
 html+='</div>';
 if(checked){const ok=answers[current]===item.c;html+=`<div class="feedback show ${ok?'correct':'incorrect'}" role="status">${answers[current]===null?'You did not select an answer for this question.':ok?'Correct.':'That is not the correct answer.'}<div class="explanation"><strong>Correct answer:</strong> ${String.fromCharCode(65+item.c)}. ${item.a[item.c]} ${item.e}</div></div>`}
 area.innerHTML=html;area.querySelectorAll('[data-choice]').forEach(btn=>btn.addEventListener('click',()=>{if(checked)return;answers[current]=Number(btn.dataset.choice);render()}));
}
prevBtn.addEventListener('click',()=>{if(current>0){current--;render()}});nextBtn.addEventListener('click',()=>{if(current<questions.length-1){current++;render()}});
document.getElementById('checkBtn').addEventListener('click',()=>{checked=true;const score=answers.reduce((n,a,i)=>n+(a===questions[i].c?1:0),0);results.classList.add('show');results.innerHTML=`<div class="resultbox"><h2>Score: ${score} / ${questions.length}</h2><p>${score===questions.length?'Excellent, all your answers are correct!':score>=11?'Well done! Review any answers you got wrong.':score>=8?'A good start. It may help to review the concepts once more.':'Review the concepts, then try again!'}</p><div class="resultline"><span>You answered ${answers.filter(x=>x!==null).length} out of ${questions.length} questions.</span><button class="action secondary" id="retryBtn" type="button">Start again</button></div></div><div class="review"><h2>Answers and solutions</h2>${questions.map((item,i)=>{const ok=answers[i]===item.c;return `<article class="review-item ${ok?'good':'bad'}"><strong>${i+1}. ${ok?'✓ Correct':'✗ Review'} — ${item.q}</strong><p><b>Correct answer:</b> ${String.fromCharCode(65+item.c)}. ${item.a[item.c]}</p><p>${item.e}</p>${answers[i]!==null&&!ok?`<p><b>Your answer:</b> ${String.fromCharCode(65+answers[i])}. ${item.a[answers[i]]}</p>`:''}</article>`}).join('')}</div>`;document.getElementById('checkBtn').textContent='Results shown';document.getElementById('checkBtn').disabled=true;document.getElementById('retryBtn').addEventListener('click',()=>{current=0;answers=Array(questions.length).fill(null);checked=false;results.classList.remove('show');results.innerHTML='';document.getElementById('checkBtn').textContent='Check answers';document.getElementById('checkBtn').disabled=false;render();window.scrollTo({top:0,behavior:'smooth'})});render();results.scrollIntoView({behavior:'smooth',block:'start'});});
render();
</script>
</body>
</html>
